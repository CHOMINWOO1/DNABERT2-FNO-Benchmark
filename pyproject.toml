[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnabert2-fno-poc"
version = "0.1.0"
description = "Frozen DNABERT-2 versus residual Fourier operator augmentation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.7,<3", "transformers==4.44.2", "huggingface-hub>=0.24,<1",
  "einops>=0.8,<1", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "gdown>=5.2,<6"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
report = ["matplotlib==3.10.8"]

[tool.setuptools.packages.find]
include = ["dnabert_fno*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
